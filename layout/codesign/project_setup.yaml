# PAM-4 driver (IHP SG13G2) — sizing + layout CO-DESIGN through the SpiceXplorer platform.
#
# The paper's Algorithm 1 (layout-in-the-loop co-design): the agent writes the
# generator G (../gen_layout.py) and DRC-safe knob bounds (this file), and
# SpiceXplorer runs the joint search theta = (theta_E, theta_L): one trial =
# build GDS -> DRC -> LVS -> kpex -> post-layout benches (flow.yaml). Trials
# that fail DRC/LVS score MAX_PENALTY on every gated metric (skip); the report
# goes back to the agent, which fixes G and repeats.
#
#   theta_E (electrical): nx, tail_ma, rc_ohm, rb_ohm, re_ohm, cdeg_ff, vcasc
#   theta_L (layout):     resistor widths + every floorplan spacing below
#
# `init` = the v2 signoff point (gen_layout.FINAL_LAYOUT + FINAL_BIASES);
# seed_from_init makes it (usually) trial 0, so the run's first line must
# reproduce the committed post-layout scorecard: S11 -10.03 / S22 -10.14 dB,
# gain 2.27 / 8.25 dB, BW 58.8 GHz, swing 2.21 Vpp, 179 mW, 7552 um2.
#
# Objective (feasibility_reward = the paper's dual-mode single objective):
# while any spec is violated the score is the weighted penalty sum; once ALL
# eight signoff specs (+ the DRC/LVS/PEX gates + I_C validity) hold, the score
# is the reward = the S11 and S22 margins below -10 dB (2 per dB each) plus a
# small area term (0.2 per 1000 um2 under the paper's 11 300 um2).
#
# Run (the platform workspace has nevergrad + the leaf tools; the block's own
# venv runs the generator and the benches):
#   cd spicexplorer-platform && uv run spicexplorer-optimize \
#       ../external/agentic-design-pam4-driver-ihp130/layout/codesign/project_setup.yaml \
#       --budget 60 --workers 4 --outdir <scratch>/pam4_codesign_r1
project:
  name: PAM4-DRIVER-CODESIGN
  description: sizing + layout co-design of the PAM-4 driver DAC (IHP SG13G2) for post-layout S11/S22 margin under the eight signoff specs
  simulator: none            # unused by the layout backend (a required DSL field)
  save_sim: false
  parallel_sim: false
  sim_engine: layout

  ws_root: .
  netlist: flow.yaml         # the DUT "netlist" is the layout-flow spec
  outdir: temp_spice_out     # <outdir>/layout/<testbench>/run_<n>_<label>/{pam4drv_pam4_lay.gds, drc/, lvs/, pex/, measure.log, summary.json}

  tech_spec:
    name: ihp-sg13g2
    constraints: {}

  # ------------------------------------------------------------------
  # theta_E — electrical sizing. nx / re_ohm / rc_ohm / rb_ohm / cdeg_ff are
  # LayoutParams fields (they draw geometry: HBT fingers, rsil lengths, cmim
  # size); tail_ma / vcasc are bench-only (deck_params -> measure_post.py: the
  # ideal tail source and the cascode bias live in the testbench, as in the
  # schematic DUTs). Validity: I_C < 3 mA per emitter finger (model card) is
  # the `ic_ma_per_finger` spec; the rsil body-length floor (re_ohm*re_w >= 12.6)
  # fails the build (-> penalty) — bounds keep it rare.
  # ------------------------------------------------------------------
  dut_params:
    - { name: nx,        min_val: 2,    max_val: 4,    init: 3,    is_integer: true, description: "npn13G2 emitter fingers per device" }
    - { name: tail_ma,   min_val: 10.0, max_val: 17.5, init: 15.0, description: "tail current per gain cell (mA)" }
    - { name: rc_ohm,    min_val: 40.0, max_val: 70.0, init: 50.0, description: "collector load per side (ohm, on-chip back-termination)" }
    - { name: rb_ohm,    min_val: 40.0, max_val: 60.0, init: 48.0, description: "input termination per side (ohm)" }
    - { name: re_ohm,    min_val: 2.0,  max_val: 6.0,  init: 3.2,  description: "emitter degeneration per side (ohm)" }
    - { name: cdeg_ff,   min_val: 8.0,  max_val: 32.0, init: 16.0, description: "emitter bridging cap (fF, HF peaking)" }
    - { name: vcasc,     min_val: 3.0,  max_val: 3.4,  init: 3.35, description: "cascode base bias (V)" }
    # ------------------------------------------------------------------
    # theta_L — layout knobs (um). Resistor lengths always re-derive from the
    # rsil model (R = 7*l/w + 9/w) so every candidate holds its resistance —
    # widths trade area/EM against parasitics. Bounds are the DRC-safe ranges
    # of the v2 generator (TM1 min width 1.64, TopVia2 pad 1.9, ...).
    # ------------------------------------------------------------------
    - { name: re_w,      min_val: 4.5,  max_val: 10.0, init: 4.5,  description: "RE rsil width (16 mA/cell path)" }
    - { name: rc_w,      min_val: 1.0,  max_val: 3.0,  init: 1.4,  description: "RC rsil width (24 mA path)" }
    - { name: rb_w,      min_val: 0.5,  max_val: 1.5,  init: 0.5,  description: "RB rsil width" }
    - { name: gap_x,     min_val: 5.5,  max_val: 9.0,  init: 6.0,  description: "inner gap of a differential pair (Cdeg lives here)" }
    - { name: row_gap,   min_val: 1.2,  max_val: 3.0,  init: 1.6,  description: "input row -> cascode row" }
    - { name: cell_gap,  min_val: 4.0,  max_val: 9.0,  init: 5.0,  description: "gap between gain cells (row length)" }
    - { name: out_gap,   min_val: 3.0,  max_val: 12.0, init: 8.0,  description: "outp <-> outn TM1 bus edge gap (differential sidewall C)" }
    - { name: out_w,     min_val: 1.64, max_val: 3.0,  init: 1.64, description: "output bus width (TM1 min 1.64)" }
    - { name: w_out,     min_val: 1.5,  max_val: 3.0,  init: 1.5,  description: "output Metal2 riser width" }
    - { name: out_off,   min_val: 1.2,  max_val: 5.0,  init: 2.0,  description: "sub bus -> outp bus" }
    - { name: rc_sep,    min_val: 4.0,  max_val: 16.0, init: 4.0,  description: "RCp <-> RCn column separation" }
    - { name: in_off,    min_val: 1.0,  max_val: 4.0,  init: 2.2,  description: "tail bus -> first input bus" }
    - { name: in_bus_gap, min_val: 1.0, max_val: 4.0,  init: 3.0,  description: "input bus pair gap (Metal4)" }
    - { name: sub_off,   min_val: 1.0,  max_val: 3.0,  init: 1.4,  description: "cascode row -> substrate bus" }
    - { name: stack_w,   min_val: 1.7,  max_val: 2.5,  init: 1.7,  description: "via-stack pad size (per-via clamped)" }

  testbenches:
    - name: layout
      description: "build -> DRC -> LVS -> kpex CC -> driver_lib benches on the extracted pam4 DUT (measure_post.py)"
      netlist: flow.yaml
      params: []
      enable: true

  optimizer_config:
    type: nevergrad
    name: TwoPointsDE
    budget: 60
    random_seed: 0
    seed_from_init: true
    optimizer_kwargs: {num_workers: 4}
    lin_variable_bounds: {min: 0, max: 1}
    log_variable_bounds: {min: 1, max: 100}
    target_specs:
      # --- the objective once feasible: reflection margin (2 per dB), a little area ---
      - { name: s11,   testbench: layout, sim_type: layout, goal: minimize, target: -10.0, range: 5.0, tolerance: 0, weight: 10, error_type: relative-absolute, reward_type: relative-absolute,
          description: "worst-path S11 <= 32 GHz (dB); reward = margin below -10 dB" }
      - { name: s22,   testbench: layout, sim_type: layout, goal: minimize, target: -10.0, range: 5.0, tolerance: 0, weight: 10, error_type: relative-absolute, reward_type: relative-absolute,
          description: "S22 <= 50 GHz (dB); reward = margin below -10 dB" }
      - { name: area_um2, testbench: layout, sim_type: layout, goal: minimize, target: 11300, range: 5000, tolerance: 0, weight: 1, error_type: relative-absolute, reward_type: relative-absolute,
          description: "core bbox area; the paper's chip is 11 300 um2" }
      # --- the remaining signoff specs as bounds (no reward) ---
      - { name: msb_gain, testbench: layout, sim_type: layout, goal: exceed,   target: 8.2,  range: 1.0, tolerance: 0, weight: 5, reward_type: none }
      - { name: lsb_gain, testbench: layout, sim_type: layout, goal: exceed,   target: 2.2,  range: 1.0, tolerance: 0, weight: 5, reward_type: none }
      - { name: weight,   testbench: layout, sim_type: layout, goal: exceed,   target: 5.0,  range: 1.0, tolerance: 0, weight: 5, reward_type: none }
      - { name: bw,       testbench: layout, sim_type: layout, goal: exceed,   target: 50.0, range: 10.0, tolerance: 0, weight: 5, reward_type: none }
      - { name: swing,    testbench: layout, sim_type: layout, goal: exceed,   target: 2.1,  range: 0.2, tolerance: 0, weight: 5, reward_type: none }
      - { name: power,    testbench: layout, sim_type: layout, goal: minimize, target: 192.0, range: 20.0, tolerance: 0, weight: 5, reward_type: none }
      # --- validity + physical gates ---
      - { name: ic_ma_per_finger, testbench: layout, sim_type: layout, goal: minimize, target: 3.0, range: 1.0, tolerance: 0, weight: 50, reward_type: none,
          description: "npn13G2 model-card validity: I_C < 3 mA per emitter finger" }
      - { name: drc_pass,  testbench: layout, sim_type: layout, goal: exact, target: 1, tolerance: 0, range: 1, weight: 100, reward_type: none }
      - { name: lvs_match, testbench: layout, sim_type: layout, goal: exact, target: 1, tolerance: 0, range: 1, weight: 100, reward_type: none }
      - { name: pex_ok,    testbench: layout, sim_type: layout, goal: exact, target: 1, tolerance: 0, range: 1, weight: 100, reward_type: none }
